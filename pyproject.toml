[project]
name = "workshop0"
version = "0.2.0"
description = "Self-hosted workshop assistant for facilitator-led hands-on technical labs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.15.1",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.33",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "google-cloud-storage>=3.17.1",
    "anthropic>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "aiosmtpd>=1.4.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
