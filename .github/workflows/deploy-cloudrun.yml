name: Deploy (Cloud Run)

# Keyless (Workload Identity Federation) deploy of Workshop0 to Cloud Run.
#   test   -> unit + integration suite against a postgres:17 service container
#   deploy -> build + push image, run the workshop0-migrate job, deploy a
#             no-traffic candidate revision, health-check it, route traffic to LATEST,
#             health-check again; on any failure restore the previous revision.
# No GCP keys are stored anywhere; the only GitHub secrets are the optional
# OPENROUTER_API_KEY / ANTHROPIC_API_KEY / ANTHROPIC_WORKSPACE_ID used by the
# guarded real-key tests (absent => those tests skip; the local gate forbids that).
#
# Runtime secrets (Secret Manager, created only by deploy/cloudrun/provision.sh):
#   always:   workshop0-database-url, workshop0-openrouter-api-key, workshop0-admin-key
#   optional: workshop0-session-secret, workshop0-google-client-secret, and the
#             Anthropic PAIR workshop0-anthropic-api-key + workshop0-anthropic-workspace-id.
#             Each optional secret is mapped only if it has an ENABLED version; the
#             Anthropic pair is mapped only when BOTH do. A missing optional secret
#             never breaks a deploy: the feature stays in its labelled
#             "not configured" state.
#
# Repository variables (all optional):
#   WORKSHOP0_GOOGLE_CLIENT_ID  Google OAuth web client id (sign-in needs it + the secret)
#   WORKSHOP0_ADMIN_EMAILS      comma-separated admin allowlist
#   WORKSHOP0_OIDC_ISSUER       default https://accounts.google.com
#   WORKSHOP0_GCS_BUCKET        default ai-agent-boilerplate0-workshop0-cvs
#
# Pushes to main deploy automatically; any other branch can be deployed by hand
# with workflow_dispatch (gh workflow run deploy-cloudrun.yml --ref <branch>).
#
# Optional repository variable WORKSHOP0_BASE_URL (e.g. https://workshop0.smalltech.in)
# is passed to the service so share links use the pretty domain. When unset the
# service derives the base URL from the request (proxy headers).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      min_instances:
        description: "Set the service min-instances (empty = leave unchanged)"
        type: choice
        options: ["", "0", "1"]
        default: ""
      drill_rollback:
        description: "Drill: health-check a path that 404s so the rollback guard fires"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  PROJECT_ID: ai-agent-boilerplate0
  REGION: us-central1
  SERVICE: workshop0

jobs:
  test:
    name: Test (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workshop0_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/workshop0_test
      WORKSHOP0_ADMIN_KEY: ci-admin-key-0123456789
      # Real-key tests are guarded: they skip when these secrets are absent.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      # Phase-11 gate env (test values only; the session secret is generated per run).
      WORKSHOP0_GOOGLE_CLIENT_ID: test-client
      WORKSHOP0_GOOGLE_CLIENT_SECRET: test-secret
      WORKSHOP0_OIDC_ISSUER: http://localhost:8099
      WORKSHOP0_ADMIN_EMAILS: admin@example.test
      WORKSHOP0_BLOB_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Generate a per-run session secret
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::${SECRET}"
          echo "WORKSHOP0_SESSION_SECRET=${SECRET}" >> "$GITHUB_ENV"
          if [ -z "${ANTHROPIC_API_KEY:-}" ] || [ -z "${ANTHROPIC_WORKSPACE_ID:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY and/or ANTHROPIC_WORKSPACE_ID secret not set: real-key network AI tests will skip."
          fi
      - name: Start the local OIDC test issuer (:8099)
        run: |
          set -euo pipefail
          nohup uv run python tests/support/fake_oidc.py --port 8099 > fake_oidc.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8099/.well-known/openid-configuration >/dev/null 2>&1 && { echo "issuer up"; exit 0; }
            sleep 1
          done
          echo "fake OIDC issuer did not start" >&2
          cat fake_oidc.log >&2 || true
          exit 1
      - name: Unit + integration tests
        run: uv run pytest tests/unit tests/integration -q
      # The OIDC test issuer was started via `uv run` and keeps the uv cache busy; if it is
      # still running, setup-uv's post-job "Pruning cache" hangs ~5 min and fails the job
      # even though every test passed. Stop it so the post step can finish.
      - name: Stop the OIDC test issuer
        if: always()
        run: pkill -f fake_oidc.py || true

  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-latest
    needs: test
    env:
      REGISTRY: us-central1-docker.pkg.dev
      RUNTIME_SA: workshop0-run@ai-agent-boilerplate0.iam.gserviceaccount.com
      MIN_INSTANCES_INPUT: ${{ inputs.min_instances }}
      DRILL_ROLLBACK: ${{ inputs.drill_rollback }}
      BASE_URL_VAR: ${{ vars.WORKSHOP0_BASE_URL }}
      GOOGLE_CLIENT_ID_VAR: ${{ vars.WORKSHOP0_GOOGLE_CLIENT_ID }}
      ADMIN_EMAILS_VAR: ${{ vars.WORKSHOP0_ADMIN_EMAILS }}
      SMTP_HOST_VAR: ${{ vars.WORKSHOP0_SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_USER_VAR: ${{ vars.WORKSHOP0_SMTP_USER }}
      SMTP_FROM_VAR: ${{ vars.WORKSHOP0_SMTP_FROM }}
      OIDC_ISSUER: ${{ vars.WORKSHOP0_OIDC_ISSUER || 'https://accounts.google.com' }}
      GCS_BUCKET: ${{ vars.WORKSHOP0_GCS_BUCKET || 'ai-agent-boilerplate0-workshop0-cvs' }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        name: Compute image reference
        run: |
          set -euo pipefail
          SHA12="${GITHUB_SHA::12}"
          IMAGE="${REGISTRY}/${PROJECT_ID}/workshop0/workshop0"
          {
            echo "SHA12=${SHA12}"
            echo "IMAGE=${IMAGE}"
            echo "IMAGE_REF=${IMAGE}:${SHA12}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/870371939888/locations/global/workloadIdentityPools/github/providers/workshop0-github
          service_account: workshop0-deployer@ai-agent-boilerplate0.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA12 }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture previous serving revision
        run: |
          set -euo pipefail
          EXISTS="$(gcloud run services list --region "$REGION" \
            --filter="metadata.name=${SERVICE}" --format='value(metadata.name)')"
          if [ -z "$EXISTS" ]; then
            echo "No existing service: safety net only (provision.sh pre-creates the placeholder service, so this is not expected)."
            echo "FIRST_DEPLOY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "FIRST_DEPLOY=false" >> "$GITHUB_ENV"
          PREV="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r '[.status.traffic[] | select((.percent // 0) > 0 and .revisionName)][0].revisionName // empty')"
          if [ -z "$PREV" ]; then
            PREV="$(gcloud run services describe "$SERVICE" --region "$REGION" \
              --format='value(status.latestReadyRevisionName)')"
          fi
          echo "Previous revision: ${PREV:-<none>}"
          echo "PREV=${PREV}" >> "$GITHUB_ENV"

      - name: Resolve optional runtime secrets (mapped only with an enabled version)
        run: |
          set -euo pipefail
          # has_enabled <secret>: true iff the secret exists and has >=1 ENABLED version.
          # A missing secret (or no enabled version) is "absent", never an error.
          has_enabled() {
            local v
            v="$(gcloud secrets versions list "$1" --project "$PROJECT_ID" \
                  --filter='state=ENABLED' --limit=1 --format='value(name)' 2>/dev/null || true)"
            [ -n "$v" ]
          }
          SECRETS="DATABASE_URL=workshop0-database-url:latest,OPENROUTER_API_KEY=workshop0-openrouter-api-key:latest,WORKSHOP0_ADMIN_KEY=workshop0-admin-key:latest"

          SESSION=false
          if has_enabled workshop0-session-secret; then
            SESSION=true
            SECRETS="${SECRETS},WORKSHOP0_SESSION_SECRET=workshop0-session-secret:latest"
            echo "workshop0-session-secret: mapped"
          else
            echo "::warning::workshop0-session-secret has no enabled version: not mapped (run provision.sh)."
          fi

          if has_enabled workshop0-google-client-secret; then
            if [ "$SESSION" = "true" ]; then
              SECRETS="${SECRETS},WORKSHOP0_GOOGLE_CLIENT_SECRET=workshop0-google-client-secret:latest"
              echo "workshop0-google-client-secret: mapped"
            else
              # Sign-in enabled without a session secret fails startup; keep sign-in off instead.
              echo "::warning::workshop0-google-client-secret exists but workshop0-session-secret does not: Google client secret NOT mapped, sign-in stays 'not configured'."
            fi
          else
            echo "workshop0-google-client-secret: absent (sign-in stays 'not configured')"
          fi

          # The Anthropic key is not workspace-scoped: it is useless (HTTP 400) without
          # the workspace id, so the two are mapped as a pair or not at all.
          AK=false; AW=false
          if has_enabled workshop0-anthropic-api-key; then AK=true; fi
          if has_enabled workshop0-anthropic-workspace-id; then AW=true; fi
          if [ "$AK" = "true" ] && [ "$AW" = "true" ]; then
            SECRETS="${SECRETS},ANTHROPIC_API_KEY=workshop0-anthropic-api-key:latest,ANTHROPIC_WORKSPACE_ID=workshop0-anthropic-workspace-id:latest"
            echo "Anthropic pair: mapped"
          else
            echo "::warning::Anthropic pair not mapped (api-key enabled=${AK}, workspace-id enabled=${AW}): network AI drafting stays 'skipped'."
          fi

          # Phase 12 email: map the SMTP password only when it has an enabled version AND a
          # sender is configured; otherwise production keeps recording mail as 'not sent'.
          if has_enabled workshop0-smtp-password && [ -n "${SMTP_USER_VAR:-}" ]; then
            SECRETS="${SECRETS},WORKSHOP0_SMTP_PASSWORD=workshop0-smtp-password:latest"
            echo "SMTP_ENABLED=true" >> "$GITHUB_ENV"
            echo "workshop0-smtp-password: mapped"
          else
            echo "SMTP_ENABLED=false" >> "$GITHUB_ENV"
            echo "workshop0-smtp-password: not mapped (secret absent or WORKSHOP0_SMTP_USER unset): email stays 'not sent'"
          fi

          # Only secret NAMES/refs go to GITHUB_ENV, never values.
          echo "RUN_SECRETS=${SECRETS}" >> "$GITHUB_ENV"

      - name: Create or update the migrate job
        run: |
          set -euo pipefail
          gcloud run jobs deploy workshop0-migrate \
            --region "$REGION" \
            --image "$IMAGE_REF" \
            --service-account "$RUNTIME_SA" \
            --command entrypoint.sh --args migrate \
            --max-retries 0 --task-timeout 600 \
            --cpu 1 --memory 512Mi \
            --network=default --subnet=default --vpc-egress=private-ranges-only \
            --set-env-vars WORKSHOP0_MIGRATE_ON_BOOT=0 \
            --set-secrets "DATABASE_URL=workshop0-database-url:latest,OPENROUTER_API_KEY=workshop0-openrouter-api-key:latest,WORKSHOP0_ADMIN_KEY=workshop0-admin-key:latest"

      - name: Run migrations (before any traffic reaches the new revision)
        run: gcloud run jobs execute workshop0-migrate --region "$REGION" --wait

      - name: Deploy the new revision
        run: |
          set -euo pipefail
          SUFFIX="sha-${SHA12}"
          # A re-run of the same commit (e.g. a rollback drill) must not collide.
          if [ "$FIRST_DEPLOY" != "true" ] && \
             gcloud run revisions list --service "$SERVICE" --region "$REGION" \
              --format='value(metadata.name)' | grep -qx "${SERVICE}-${SUFFIX}"; then
            SUFFIX="${SUFFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "NEW_REVISION=${SERVICE}-${SUFFIX}" >> "$GITHUB_ENV"

          # '|' is the --set-env-vars delimiter: admin emails contain '@' and ','.
          for v in "${BASE_URL_VAR:-}" "${GOOGLE_CLIENT_ID_VAR:-}" "${ADMIN_EMAILS_VAR:-}" "$OIDC_ISSUER" "$GCS_BUCKET" \
                   "${SMTP_HOST_VAR:-}" "${SMTP_USER_VAR:-}" "${SMTP_FROM_VAR:-}"; do
            case "$v" in *"|"*) echo "a repository variable contains '|', which is the env delimiter" >&2; exit 1;; esac
          done
          ENVVARS="WORKSHOP0_MIGRATE_ON_BOOT=0"
          if [ -n "${BASE_URL_VAR:-}" ]; then
            ENVVARS="${ENVVARS}|WORKSHOP0_BASE_URL=${BASE_URL_VAR}"
          fi
          ENVVARS="${ENVVARS}|WORKSHOP0_BLOB_BACKEND=gcs|WORKSHOP0_GCS_BUCKET=${GCS_BUCKET}"
          ENVVARS="${ENVVARS}|WORKSHOP0_OIDC_ISSUER=${OIDC_ISSUER}"
          if [ -n "${GOOGLE_CLIENT_ID_VAR:-}" ]; then
            ENVVARS="${ENVVARS}|WORKSHOP0_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID_VAR}"
          fi
          if [ -n "${ADMIN_EMAILS_VAR:-}" ]; then
            ENVVARS="${ENVVARS}|WORKSHOP0_ADMIN_EMAILS=${ADMIN_EMAILS_VAR}"
          fi
          if [ "${SMTP_ENABLED:-false}" = "true" ]; then
            ENVVARS="${ENVVARS}|WORKSHOP0_SMTP_HOST=${SMTP_HOST_VAR}|WORKSHOP0_SMTP_PORT=587|WORKSHOP0_SMTP_STARTTLS=true"
            ENVVARS="${ENVVARS}|WORKSHOP0_SMTP_USER=${SMTP_USER_VAR}"
            if [ -n "${SMTP_FROM_VAR:-}" ]; then
              ENVVARS="${ENVVARS}|WORKSHOP0_SMTP_FROM=${SMTP_FROM_VAR}"
            fi
          fi

          ARGS=(
            --region "$REGION"
            --image "$IMAGE_REF"
            --service-account "$RUNTIME_SA"
            --port 8080
            --cpu 1 --memory 512Mi --concurrency 40 --timeout 60
            --max-instances 3
            --cpu-boost --cpu-throttling
            --network=default --subnet=default --vpc-egress=private-ranges-only
            --set-env-vars "^|^${ENVVARS}"
            --set-secrets "$RUN_SECRETS"
            --revision-suffix "$SUFFIX"
          )
          # A normal deploy never changes min-instances (omitting preserves the live value).
          if [ -n "${MIN_INSTANCES_INPUT:-}" ]; then
            ARGS+=(--min-instances "$MIN_INSTANCES_INPUT")
          fi

          if [ "$FIRST_DEPLOY" = "true" ]; then
            [ -n "${MIN_INSTANCES_INPUT:-}" ] || ARGS+=(--min-instances 0)
            gcloud run deploy "$SERVICE" "${ARGS[@]}"
          else
            gcloud run deploy "$SERVICE" "${ARGS[@]}" --no-traffic --tag candidate
          fi

      - name: Health-check the candidate
        run: |
          set -euo pipefail
          SVC_JSON="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json)"
          SERVICE_URL="$(jq -r '.status.url' <<<"$SVC_JSON")"
          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"
          if [ "$FIRST_DEPLOY" = "true" ]; then
            CHECK_URL="$SERVICE_URL"   # first deploy already serves 100%
          else
            CHECK_URL="$(jq -r '[.status.traffic[] | select(.tag=="candidate")][0].url // empty' <<<"$SVC_JSON")"
            [ -n "$CHECK_URL" ] || CHECK_URL="${SERVICE_URL/https:\/\//https://candidate---}"
          fi
          HEALTH_PATH="/api/health"
          if [ "$DRILL_ROLLBACK" = "true" ]; then
            HEALTH_PATH="/api/health-drill-404"
            echo "DRILL: probing ${HEALTH_PATH}; this run is expected to fail and roll back."
          fi
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 5 "${CHECK_URL}${HEALTH_PATH}" 2>/dev/null || true)"
            if jq -e '(.data // .) | .status == "ok" and .db == "ok"' <<<"$BODY" >/dev/null 2>&1; then
              echo "Candidate healthy: ${CHECK_URL}${HEALTH_PATH}"
              exit 0
            fi
            sleep 2
          done
          echo "Candidate failed its health check: ${CHECK_URL}${HEALTH_PATH}" >&2
          exit 1

      - name: Shift traffic to the new revision
        if: env.FIRST_DEPLOY != 'true'
        run: |
          set -euo pipefail
          # Route to LATEST (not a pinned revision name) so that any later
          # `gcloud run services update ...` (e.g. --min-instances) creates a
          # revision that serves traffic immediately. The --no-traffic deploy above
          # pinned the old revision; this un-pins it. Assert the result below.
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest
          LATEST="$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')"
          [ "$LATEST" = "$NEW_REVISION" ] || { echo "latest ($LATEST) != deployed ($NEW_REVISION)" >&2; exit 1; }

      - name: Health-check the service
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 5 "${SERVICE_URL}/api/health" 2>/dev/null || true)"
            if jq -e '(.data // .) | .status == "ok" and .db == "ok"' <<<"$BODY" >/dev/null 2>&1; then
              echo "Service healthy: ${SERVICE_URL}/api/health"
              exit 0
            fi
            sleep 2
          done
          echo "Service failed its post-shift health check" >&2
          exit 1

      - name: Remove the candidate tag
        if: env.FIRST_DEPLOY != 'true'
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --remove-tags candidate

      - name: Roll back to the previous revision
        if: failure() && env.PREV != ''
        run: |
          set -uo pipefail
          echo "Deploy failed: restoring ${PREV}=100"
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${PREV}=100"
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --remove-tags candidate || true
